# The required checks of every pull request and of main: quality (shell,
# workflow, link, lane and compliance checks), the gates on the pinned Bend
# release natively on Linux x86_64 and macOS ARM64, the programs that run
# under Node 22 and 24, and the semantic conventions package regenerated from
# the pinned registry. The native and node jobs also run their programs
# in-process, on the JavaScript lane. required-baseline is the one check
# branch protection needs.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        env:
          GOBIN: ${{ runner.temp }}/quality-bin
      - name: ShellCheck and actionlint
        run: |
          shellcheck --version
          shellcheck bend scripts/*.sh
          "$RUNNER_TEMP/quality-bin/actionlint" -color
      - name: Syntax of the JavaScript files
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(git ls-files -z -- '*.js' '*.mjs')
      - name: Lane lint
        run: |
          ./scripts/lint-lanes.sh
          ./scripts/test-lint-lanes.sh
      - name: Compliance status
        run: |
          ./scripts/compliance.sh --check
          ./scripts/test-compliance.sh
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          advanced-security: false
          annotations: true
      - name: Local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress '*.md' 'packages/**/*.md' 'qualification/**/*.md'
          output: build/quality/local-links.md
          fail: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: quality-${{ github.run_id }}
          path: build/quality/
          if-no-files-found: ignore
          retention-days: 14

  native:
    name: native (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            system: Linux
            architecture: x86_64
          - platform: macos-arm64
            runner: macos-14
            system: Darwin
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify runner architecture
        run: |
          test "$(uname -s)" = "$EXPECTED_SYSTEM"
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      - name: Install the pinned Bend
        run: ./scripts/setup-bend.sh
      - name: Proofs and manifests
        run: ./scripts/validate.sh
      - name: Independent consumer, natively
        run: ./scripts/test-consumer.sh native "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            build/validation/
            build/consumer-native/
          if-no-files-found: error
          retention-days: 14

  node:
    name: node (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Node 22 or newer is supported; CI tests the first and the current
        # release of the 22 and 24 lines.
        node: ['22.18.0', '22', '24.0.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the pinned Bend
        run: ./scripts/setup-bend.sh
      - name: Proofs and manifests
        run: ./scripts/validate.sh
      - name: Independent consumer, compiled to JavaScript
        run: ./scripts/test-consumer.sh node "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: node-${{ matrix.node }}-${{ github.run_id }}
          path: |
            build/validation/
            build/consumer-node/
          if-no-files-found: error
          retention-days: 14

  semconv:
    name: semconv
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The committed semantic conventions are the generated code
        run: ./scripts/semconv-generate.sh --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: semconv-${{ github.run_id }}
          path: build/semconv/
          if-no-files-found: error
          retention-days: 14

  required-baseline:
    name: required-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [quality, native, node, semconv]
    steps:
      - name: Every required job succeeded
        run: |
          test "$QUALITY_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$NODE_RESULT" = success
          test "$SEMCONV_RESULT" = success
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          NODE_RESULT: ${{ needs.node.result }}
          SEMCONV_RESULT: ${{ needs.semconv.result }}

  # The qualification harness (qualification/README.md): the verifier's unit
  # tests, then the Collector, Tempo and Grafana stack fed with the reference
  # trace by curl. Not required yet: it joins required-baseline once it has
  # proved stable (#56).
  qualification:
    name: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Unit tests of the verifier
        run: node --test qualification/*.test.mjs
      - name: Start the stack
        run: ./scripts/qualify.sh up
      - name: Send the reference trace with curl and verify it
        run: ./scripts/qualify.sh run --producer curl
      - name: Stop the stack and keep its logs
        if: ${{ !cancelled() }}
        run: ./scripts/qualify.sh down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: qualification-${{ github.run_id }}
          path: build/qualification/
          if-no-files-found: error
          retention-days: 14
