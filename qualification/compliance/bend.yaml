# Implementation status for Bend: bend-telemetry, against the compliance
# matrix of the OpenTelemetry specification at the release that
# `specification` names. ./scripts/compliance.sh checks this file against
# that release's template.yaml, kept beside it, and generates COMPLIANCE.md
# from it; a pull request that implements a row updates the row here
# (CONTRIBUTING.md, "Compliance").
#
# Legend of `status`, the specification's:
#   '+'     Implemented
#   '-'     Not implemented
#   'N/A'   Not applicable to this language
#
# The keys of this project, which the specification's generator ignores,
# say what COMPLIANCE.md shows:
#   note     with '+', what to know about the row
#   partial  with '-' and a ticket, what exists of the row
#   ticket   with '-', the issue that implements the row, or its rest
#   reason   why the row does not apply to this project, with 'N/A' when its
#            subject does not exist in this design, as Go records the
#            implicit context, or with '-' when a specification of this
#            project decided against it
specification: v1.61.0
sections:
