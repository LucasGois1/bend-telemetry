            reason: There is no implicit context; every operation that needs a parent takes a context
              passed explicitly (#2), as Go records it.
          - name: Safe for concurrent calls
            status: '-'
            ticket: 7
      - heading: '[SpanContext](specification/trace/api.md#spancontext)'
        features:
          - name: IsValid
            status: 'N/A'
            reason: There is no invalid span context (#2); absence stands for it, and the identifiers of
              a span context are always valid (#5).
          - name: IsRemote
            status: '+'
            note: Whether a span context is remote is its variant, which `Api.SpanContext.is_remote`
              answers (#5).
          - name: Conforms to the W3C TraceContext spec
            status: '+'
            note: A span context wraps the W3C Trace Context values of bend-trace-context, an incoming
              context when remote and an outgoing one when local (#5), and reads their trace flags
              (#10).
          - name: '[Support W3C Trace Context Level 2 randomness](specification/trace/sdk.md#traceid-randomness)'
            status: '-'
            partial: A span context reads the random-trace-id flag of its trace ID through
              `Api.SpanContext.trace_flags` (#10).
            ticket: 15
      - heading: '[Span](specification/trace/api.md#span)'
        features:
          - name: Create root span
            status: '-'
            ticket: 7
          - name: Create with default parent (active span)
            status: 'N/A'
            reason: There is no implicit context; every operation that needs a parent takes a context
              passed explicitly (#2), as Go records it.
          - name: Create with parent from Context
            status: '-'
            ticket: 7
          - name: No explicit parent Span/SpanContext allowed
            status: '-'
            ticket: 7
          - name: SpanProcessor.OnStart receives parent Context
            status: '-'
            ticket: 16
          - name: UpdateName
            status: '+'
            note: Through the pure operation `Api.Span.update_name` (#6).
          - name: User-defined start timestamp
            status: '-'
            ticket: 7
          - name: End
            status: '-'
            ticket: 7
          - name: End with timestamp
            status: '-'
            ticket: 7
          - name: IsRecording
            status: '+'
            note: Through `Api.Span.is_recording`, on a copy of the span (#6).
          - name: IsRecording becomes false after End
            status: 'N/A'
            reason: Ending consumes the span (#2), and spans are values (#6), so a copy taken before the
              end keeps answering as the span did then.
          - name: Set status with StatusCode (Unset, Ok, Error)
            status: '+'
            note: Through `Api.Span.set_status`; ok is final, and a description exists only with an
              error (#6).
          - name: Safe for concurrent calls
            status: 'N/A'
            reason: A span has one owner (#2); only the computation that holds it records into it, and a
              forked computation starts spans of its own and hands events back as data.
          - name: events collection size limit
            status: '+'
            note: An event past the event count of the span limits is dropped and counted (#6).
          - name: attribute collection size limit
            status: '+'
            note: An attribute past the attribute count of the span limits is dropped and counted (#6).
          - name: links collection size limit
            status: '+'
            note: A link past the link count of the span limits is dropped and counted (#6).
          - name: '[SpanProcessor.OnEnding](specification/trace/sdk.md#onending)'
            status: '-'
            reason: Out of scope of the API (#2) and the SDK (#11); the specification marks it
              Development.
      - heading: '[Span attributes](specification/trace/api.md#set-attributes)'
        features:
          - name: SetAttribute
            status: '+'
            note: Through `Api.Span.set_attribute` and `Api.Span.set_attributes`, under the span
              limits (#6).
          - name: String type
            status: '+'
            note: The attribute value `Api.StringValue` (#4).
          - name: Boolean type
            status: '+'
            note: The attribute value `Api.BoolValue` (#4).
          - name: Double floating-point type
            status: '-'
            partial: Span attributes take doubles (#6), held as an F32 until Base ships F64, so a value
              that an F32 cannot hold exactly loses precision (#4).
            ticket: 2
          - name: Signed int64 type
            status: '+'
            note: The attribute value `Api.IntValue`, a 64-bit integer over two U32 limbs, exact over
              the whole range (#4).
          - name: Array of primitives (homogeneous)
            status: '+'
            note: The standard values of the specification, built by `Api.AttributeValue.strings`,
              `bools`, `ints` and `doubles` (#4).
          - name: '`null` values documented as invalid/undefined'
            status: 'N/A'
            reason: Bend has no null; an attribute value is one of the eight variants of its type, the
              empty value among them (#4).
          - name: Unicode support for keys and string values
            status: '+'
            note: Keys and string values are strings of Unicode characters, and the length limit counts
              characters (#4).
      - heading: '[Span linking](specification/trace/api.md#specifying-links)'
        features:
          - name: Links can be recorded on span creation
            status: '-'
            ticket: 7
          - name: Links can be recorded after span creation
            status: '+'
            note: Through `Api.Span.add_link` and `Api.Span.add_links`, under the span limits (#6).
          - name: Links order is preserved
            status: '+'
            note: A span keeps its links in the order added (#6).
      - heading: '[Span events](specification/trace/api.md#add-events)'
        features:
          - name: AddEvent
            status: '-'
            partial: Events with an explicit timestamp, through `Api.Span.add_event_at`, and the events
              that a forked computation returns, through `Api.Span.add_events` (#6).
            ticket: 7
          - name: Add order preserved
            status: '+'
            note: A span keeps its events in the order added (#6).
          - name: Safe for concurrent calls
            status: 'N/A'
            reason: A span has one owner (#2); only the computation that holds it records into it, and a
              forked computation starts spans of its own and hands events back as data.
      - heading: '[Span exceptions](specification/trace/api.md#record-exception)'
        features:
          - name: RecordException
            status: '-'
            partial: With an explicit timestamp, through `Api.Span.record_exception`, as the event
              `exception` with `exception.type` and `exception.message` and no stack trace (#6).
            ticket: 7
          - name: RecordException with extra parameters
            status: '-'
            partial: With an explicit timestamp, through `Api.Span.record_exception_with` (#6).
            ticket: 7
      - heading: '[Sampling](specification/trace/sdk.md#sampling)'
        features:
          - name: Allow samplers to modify tracestate
            status: '-'
            ticket: 14
          - name: ShouldSample gets full parent Context
            status: '-'
            ticket: 14
          - name: 'Sampler: JaegerRemoteSampler'
            status: '-'
            reason: Out of scope of the SDK (#11).
          - name: '[New Span ID created also for non-recording Spans](specification/trace/sdk.md#sdk-span-creation)'
            status: '-'
            ticket: 15
          - name: '[IdGenerators](specification/trace/sdk.md#id-generators)'
            status: '-'
            ticket: 16
          - name: '[SpanLimits](specification/trace/sdk.md#span-limits)'
            status: '-'
            partial: The span limits have the defaults of the specification and spans enforce them
              (#6), and the configuration of the SDK sets them in code and from the environment (#12).
            ticket: 15
          - name: '[Built-in `SpanProcessor`s implement `ForceFlush` spec](specification/trace/sdk.md#forceflush-1)'
            status: '-'
            ticket: 17
          - name: '[Attribute Limits](specification/common/README.md#attribute-limits)'
            status: '-'
            partial: Attribute limits bound the count and the value length of the attributes of spans,
              events and links, truncating strings (#6), and the general limits are read from the
              environment (#12).
            ticket: 15
          - name: Fetch InstrumentationScope from ReadableSpan
            status: '-'
            partial: The span data that the SDK will hand to processors and exporters carries the
              instrumentation scope, which `Api.SpanData.scope` reads (#6).
            ticket: 15
          - name: '[TraceIdRatioBased sampler implements OpenTelemetry tracestate `th` field](specification/trace/sdk.md#traceidratiobased)'
            status: '-'
            ticket: 14
          - name: '[CompositeSampler and built-in ComposableSamplers](specification/trace/sdk.md#compositesampler)'
